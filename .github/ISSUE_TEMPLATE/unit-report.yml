name: "Unit report (worked / didn't work)"
description: "Tell us whether the guide worked on your Pod. Confirmations AND failures both help."
title: "[Unit report] "
labels: ["unit-report"]
body:
  - type: markdown
    attributes:
      value: "Thanks for reporting — even a plain \"worked on mine\" is genuinely useful to the next person."
  - type: input
    id: model
    attributes:
      label: "Pod model / base-label text"
      description: "From the sticker on the base, e.g. SP8096 (Gen3)."
      placeholder: "SP8096"
    validations:
      required: true
  - type: dropdown
    id: outcome
    attributes:
      label: "Outcome"
      options:
        - "Fully working"
        - "Partially working"
        - "Failed / bricked"
    validations:
      required: true
  - type: input
    id: firmware
    attributes:
      label: "Stock Solstice firmware version (if known)"
      placeholder: "e.g. 6.3 / build 39164"
  - type: textarea
    id: notes
    attributes:
      label: "What happened"
      description: "Which steps worked, where it diverged, anything different from the guide."
  - type: checkboxes
    id: confirm
    attributes:
      label: "Confirm"
      options:
        - label: "This is a Pod I own."
          required: true
